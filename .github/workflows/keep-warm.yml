# Render's free plan puts a service to sleep after 15 idle minutes, and waking it takes
# about a minute. A request every 10 minutes keeps the site answering instantly.
name: Keep the site warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the website and the API behind it
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 -o /dev/null https://kavach-puxhkar.onrender.com/
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 -o /dev/null https://kavach-puxhkar.onrender.com/api/v1/agents
