# Render Blueprint: New → Blueprint → pick this repo. Creates the backend and the website
# on the free plan. The two secrets (LLM_API_KEY, GNANI_API_KEY) are asked for in Render's
# dashboard during setup — they are never stored in this repo.
services:
  - type: web
    name: kavach-api-puxhkar
    runtime: docker
    plan: free
    dockerfilePath: ./services/narada/Dockerfile
    dockerContext: ./services/narada
    healthCheckPath: /health
    envVars:
      - key: STORAGE_BACKEND
        value: memory
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_JSON_MODE
        value: json_object
      - key: LLM_REASONING_EFFORT
        value: none
      # Groq's free tier allows 8,000 tokens a minute: retry on rate limits, one call at a time.
      - key: LLM_MAX_RETRIES
        value: "6"
      - key: RUN_CONCURRENCY
        value: "1"
      - key: GNANI_MAX_PARALLEL_REQUESTS
        value: "1"
      # The website's public address (Render serves each service at <name>.onrender.com).
      - key: CORS_ORIGINS
        value: https://kavach-puxhkar.onrender.com
      - key: LLM_API_KEY
        sync: false
      - key: GNANI_API_KEY
        sync: false

  - type: web
    name: kavach-puxhkar
    runtime: docker
    plan: free
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /
    envVars:
      # The backend's public address; baked into the site when it is built.
      - key: NEXT_PUBLIC_NARADA_URL
        value: https://kavach-api-puxhkar.onrender.com
