# Render Blueprint: New → Blueprint → pick this repo. Creates one free web service that runs
# both the website and the API (see Dockerfile and start.sh). One service, kept warm by
# .github/workflows/keep-warm.yml, fits the free plan's 750 hours a month; two would not.
# The two secrets (LLM_API_KEY, GNANI_API_KEY) are asked for in Render's dashboard during
# setup — they are never stored in this repo.
services:
  - type: web
    name: kavach-puxhkar
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # The browser calls the site's own address; the site forwards /api/v1 to the API.
      - key: NEXT_PUBLIC_NARADA_URL
        value: https://kavach-puxhkar.onrender.com
      - key: STORAGE_BACKEND
        value: memory
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_JSON_MODE
        value: json_object
      - key: LLM_REASONING_EFFORT
        value: none
      # Groq's free tier allows 8,000 tokens a minute: retry on rate limits, one call at a time.
      - key: LLM_MAX_RETRIES
        value: "6"
      - key: RUN_CONCURRENCY
        value: "1"
      - key: GNANI_MAX_PARALLEL_REQUESTS
        value: "1"
      - key: LLM_API_KEY
        sync: false
      - key: GNANI_API_KEY
        sync: false
